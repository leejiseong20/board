# 이 파일을 복사해 application.properties로 이름을 바꾸고 값을 채워 사용하세요.

server.port=8080

# 1. DB 설정
spring.datasource.url=jdbc:mysql://YOUR_DB_HOST:3306/board?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. JWT 설정
jwt.secret=YOUR_JWT_SECRET_AT_LEAST_32_CHARS
jwt.expiration=86400000

# 4. 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=YOUR_UPLOAD_DIR

# 5. Kakao API 설정
kakao.rest-api-key=YOUR_KAKAO_REST_API_KEY
